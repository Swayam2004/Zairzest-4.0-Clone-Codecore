<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zairza Sign Up</title>
  <link rel="stylesheet" href="sign up.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="overlay">
        <h1>Enter the untamed<br>wilderness with<br><span>ZAIRZA</span></h1>
        <p>Release all your stress with the exciting Tech and Fun events in the most awaited fest. Zairzest 3.0 presented by Zairza.</p>
        <div class="dots">
          <span></span><span class="active"></span><span></span>
        </div>
      </div>
    </div>
    <div class="right">
      <h2>Become the Beast of<br>the Cyber Forest</h2>
      <p class="subtext">Sign In to get into Zairzest</p>
      <form>
        <input type="text" placeholder="Name" required />
        <input type="email" placeholder="Email here" required />
        <div class="password-wrapper">
          <input type="password" placeholder="Password" required />
          <span class="eye">&#128065;</span>
        </div>
        <p class="signin-text">Already a Member Yet? <a href="#">Sign In</a></p>
        
        <div class="buttons">
          <button type="submit" class="btn-primary">Sign Up</button>
          <div class="or">or</div>
          <button type="button" class="btn-google"></button>
          <button type="submit" class="btn-primary">Sign up with<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20.000001907348633px;"  height="20.000001907348633px;"></button></button>
         
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
